name: Sync Documentation to GitHub Wiki

on:
  push:
    branches: [ main ]
    paths:
      - 'docs/wiki/**'
      - 'scripts/sync-wiki.mjs'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-wiki:
    name: Sync Astro Documentation to Wiki
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source repository
        uses: actions/checkout@v4

      - name: Checkout wiki repository
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}.wiki
          path: wiki
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync curated wiki pages
        run: node scripts/sync-wiki.mjs wiki

      - name: Commit and push wiki
        working-directory: wiki
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "Wiki is already up to date."
          else
            git commit -m "docs(wiki): sync Astro documentation [skip ci]"
            git push origin HEAD:master
          fi
