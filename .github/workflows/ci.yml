name: CI Check

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/copilot-instructions.md'
      - 'LICENSE'
      - '.gitignore'
      - '.node-version'
      - '.nvmrc'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/copilot-instructions.md'
      - 'LICENSE'
      - '.gitignore'
      - '.node-version'
      - '.nvmrc'

# Cancel stale runs when a newer commit arrives; after the final push, the latest head is validated.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Typecheck, Tests & Build Verification
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Report toolchain versions
        run: |
          node --version
          npm --version

      - name: Install Dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Run Full Test Suite
        run: npm test

      - name: Run Multilingual / Calculation QA Explicitly
        run: npm run test:qa:i18n

      - name: Typecheck
        run: npm run lint

      - name: Test Production Build
        run: npm run build
